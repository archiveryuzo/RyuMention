name: Build plugin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -o RyuMention.zip

      - name: Build jar
        run: mvn -B package
        working-directory: RyuMention

      - uses: actions/upload-artifact@v4
        with:
          name: RyuMention-jar
          path: RyuMention/target/RyuMention-*.jar
